<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0720">
<title>Campetto League · Sito Ufficiale</title>
<meta name="description" content="Classifica e marcatori della Campetto League 2026/2027">
<link rel="icon" href="img/logo-lega.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Campetto League">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero">
  <img src="img/logo-lega.png" alt="Logo Campetto League" width="104" height="104">
  <h1 class="display">Campetto<br>League</h1>
  <span class="pill" id="pill">Stagione 2026/2027</span>
  <div class="stats" id="stats"></div>
</header>
<nav role="tablist" aria-label="Sezioni">
  <button class="tab" role="tab" data-tab="classifica" aria-selected="true">Classifica</button>
  <button class="tab" role="tab" data-tab="marcatori" aria-selected="false">Marcatori</button>
  <button class="tab" role="tab" data-tab="calendario" aria-selected="false">Calendario</button>
  <button class="sbtn" id="sbtn" aria-label="Cerca giocatore"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
</nav>
<main>
  <section id="panel-classifica" role="tabpanel">
    <div class="cols"><span>#</span><span>Squadra</span><span>PG</span><span>V</span><span>P</span><span>S</span><span class="gx">GF</span><span class="gx">GS</span><span>DR</span><span>PT</span></div>
    <div id="squadre"></div>
    <p class="hint">Tocca una squadra per vedere i dettagli. A parità di punti decidono: scontri diretti, poi differenza reti, poi gol fatti.</p>
    <br>
    <h2 class="display sh" align="center">Statistiche di lega</h2>
    <div class="lstats" id="lstats"></div>
  </section>
  <section id="panel-marcatori" role="tabpanel" hidden>
    <div class="podio" id="podio"></div>
    <div class="chips" id="chips" aria-label="Filtra per squadra"></div>
    <div id="lista"></div>
  </section>
  <section id="panel-calendario" role="tabpanel" hidden>
    <div id="nextm"></div>
    <div class="chips" id="cchips" aria-label="Filtra per squadra"></div>
    <div class="gps" id="gps" role="group" aria-label="Giornata"></div>
    <div id="cal"></div>
  </section>
</main>
<dialog id="dlg" aria-label="Dettaglio squadra"></dialog>
<dialog id="srch" aria-label="Cerca giocatore">
  <input id="q" type="search" placeholder="Cerca giocatore, numero o squadra" autocomplete="off" aria-label="Cerca">
  <div id="qres"></div>
  <button class="close">Chiudi</button>
</dialog>
<footer>
  <div class="soc">
    <a href="https://www.instagram.com/campettoleague/" target="_blank" rel="noopener noreferrer" aria-label="Instagram Campetto League"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
    <a href="https://www.tiktok.com/@campettoleague" target="_blank" rel="noopener noreferrer" aria-label="TikTok Campetto League"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg></a>
  </div><img src="img/logo-lega.png" alt=""><span id="agg">Caricamento…</span><br><br>© 2025 Campetto League</footer>
<script src="script.js"></script>
</body>
</html>
